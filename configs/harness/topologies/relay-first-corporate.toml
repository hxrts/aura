# Relay-first shape with bob behind a symmetric corporate NAT (EDM random ports,
# TCP 80/443 and UDP 53 only). Direct traversal cannot succeed here; the relay
# path must carry everything. See relay-first-double-nat.toml for the home
# variant.
name = "relay-first-corporate"
required_relay_authority = "relay"

[[routers]]
name = "core-dc"
nat = "none"
firewall = "open"

[[routers]]
name = "nat-a"
nat = "home"
upstream = "core-dc"
firewall = "home"

[[routers]]
name = "nat-b"
nat = "corporate"
upstream = "core-dc"
firewall = "corporate"

[[links]]
left = "relay-dev"
right = "core-dc"
condition = "lan"

[[links]]
left = "alice-dev"
right = "nat-a"
condition = "wifi"

[[links]]
left = "bob-dev"
right = "nat-b"
condition = "wifi"

[[authorities]]
authority_id = "relay"
device_name = "relay-dev"
gateway_router = "core-dc"
bind_address = "0.0.0.0:41000"
relay_capable = true

[[authorities]]
authority_id = "alice"
device_name = "alice-dev"
gateway_router = "nat-a"
bind_address = "0.0.0.0:41001"
relay_capable = false

[[authorities]]
authority_id = "bob"
device_name = "bob-dev"
gateway_router = "nat-b"
bind_address = "0.0.0.0:41002"
relay_capable = false
