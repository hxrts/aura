[package]
name = "aura-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Webapp for Aura built with Dioxus 0.7"
publish = false

[lints]
workspace = true

[features]
# Canonical shipping builds reject development key providers throughout the graph.
production-build = ["aura-agent/production-build", "aura-effects/production-build"]
default = []
web = ["dioxus/web"]
harness = []

[dependencies]
aura-app = { package = "hxrts-aura-app", path = "../aura-app", version = "=0.2.0", features = ["web-js"] }
aura-agent = { package = "hxrts-aura-agent", path = "../aura-agent", version = "=0.2.0", features = ["web"] }
aura-core = { package = "hxrts-aura-core", path = "../aura-core", version = "=0.2.0" }
aura-effects = { package = "hxrts-aura-effects", path = "../aura-effects", version = "=0.2.0" }
aura-ui = { path = "../aura-ui" }

async-lock = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
cfg-if = "1"
dioxus = { workspace = true, features = ["launch", "macro", "hooks", "signals", "html"] }
form_urlencoded = "1.2"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Poll-boundary observation audits this exact upstream renderer implementation.
dioxus-web = { version = "=0.7.4", default-features = false }
gloo-net = { version = "0.6", features = ["http"] }
js-sys = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
tracing-wasm = "0.2"
web-sys = { workspace = true, features = ["Window", "Event", "EventInit", "EventTarget", "ResizeObserver", "MutationObserver", "MutationObserverInit", "MutationRecord", "Document", "Element", "Node", "DomRect", "CssStyleDeclaration", "HtmlElement", "HtmlTextAreaElement", "Navigator", "Clipboard", "Storage", "Location", "console", "AbortController", "AbortSignal", "RequestInit", "Response"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
