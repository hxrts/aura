# Relay-first contact link with bob behind a symmetric corporate NAT.
#
# Three real instances inside patchbay namespaces: a public relay behind a
# NAT-less core router and two peers behind their own NATs
# (configs/harness/topologies/relay-first-corporate.toml). Contact phases of scenario 13 run between
# the peers, then network events exercise the rendezvous path: a NAT flush on
# bob's router and a link toggle on alice. Observations are the shared semantic
# contract's: contact link readiness, the runtime's selected path toward bob
# (`peer_path_selected`, relay across NATs) and the network generation that
# advances when bob re-establishes its relay session after the NAT flush.
id = "holepunch-relay-first-corporate"
goal = "Link a peer behind symmetric NAT through the relay path only, then survive a NAT flush and a link toggle."

[[steps]]
id = "launch"
action = "launch_actors"
timeout_ms = 30000

[[steps]]
id = "relay-onboarding-visible"
action = "screen_is"
actor = "relay"
screen_id = "onboarding"
timeout_ms = 60000

[[steps]]
id = "relay-create-account"
action = "create_account"
actor = "relay"
value = "RelayUser"
timeout_ms = 4000

[[steps]]
id = "relay-neighborhood-ready"
action = "readiness_is"
actor = "relay"
readiness = "ready"
timeout_ms = 120000
[[steps]]
id = "alice-onboarding-visible"
action = "screen_is"
actor = "alice"
screen_id = "onboarding"
timeout_ms = 60000

[[steps]]
id = "bob-onboarding-visible"
action = "screen_is"
actor = "bob"
screen_id = "onboarding"
timeout_ms = 60000

[[steps]]
id = "alice-create-account"
action = "create_account"
actor = "alice"
value = "AliceUser"
timeout_ms = 3000

[[steps]]
id = "bob-create-account"
action = "create_account"
actor = "bob"
value = "BobUser"
timeout_ms = 4000

[[steps]]
id = "alice-neighborhood-visible"
action = "screen_is"
actor = "alice"
screen_id = "neighborhood"
timeout_ms = 120000

[[steps]]
id = "alice-neighborhood-ready"
action = "readiness_is"
actor = "alice"
readiness = "ready"
timeout_ms = 120000

[[steps]]
id = "bob-neighborhood-visible"
action = "screen_is"
actor = "bob"
screen_id = "neighborhood"
timeout_ms = 120000

[[steps]]
id = "bob-neighborhood-ready"
action = "readiness_is"
actor = "bob"
readiness = "ready"
timeout_ms = 120000

[[steps]]
id = "alice-create-home"
action = "create_home"
actor = "alice"
value = "Alice Home"
timeout_ms = 12000

[[steps]]
id = "alice-open-contacts"
action = "open_screen"
actor = "alice"
screen_id = "contacts"
timeout_ms = 3000

[[steps]]
id = "bob-open-contacts"
action = "open_screen"
actor = "bob"
screen_id = "contacts"
timeout_ms = 3000

[[steps]]
id = "capture-alice-authority-id"
action = "capture_current_authority_id"
actor = "alice"
name = "alice_authority_id"
timeout_ms = 3000

[[steps]]
id = "capture-bob-authority-id"
action = "capture_current_authority_id"
actor = "bob"
name = "bob_authority_id"
timeout_ms = 3000

[[steps]]
id = "bob-create-contact-invitation"
action = "create_contact_invitation"
actor = "bob"
value = "${alice_authority_id}"
timeout_ms = 30000

[[steps]]
id = "bob-invitation-code-ready"
action = "runtime_event_occurred"
actor = "bob"
runtime_event_kind = "invitation_code_ready"
name = "invite_code"
timeout_ms = 30000

[[steps]]
id = "alice-accept-contact-invitation"
action = "accept_contact_invitation"
actor = "alice"
value = "${invite_code}"
timeout_ms = 12000

[[steps]]
id = "alice-contact-link-ready"
action = "runtime_event_occurred"
actor = "alice"
runtime_event_kind = "contact_link_ready"
timeout_ms = 30000

[[steps]]
id = "alice-open-chat-before-join"
action = "open_screen"
actor = "alice"
screen_id = "chat"
timeout_ms = 6000

[[steps]]
id = "alice-join-shared-channel"
action = "create_channel"
actor = "alice"
value = "shared-parity-lab"
timeout_ms = 6000

[[steps]]
id = "alice-open-contacts-before-invite"
action = "open_screen"
actor = "alice"
screen_id = "contacts"
timeout_ms = 6000

[[steps]]
id = "alice-invite-bob-to-shared-channel"
action = "invite_actor_to_channel"
actor = "alice"
value = "${bob_authority_id}"
timeout_ms = 15000

[[steps]]
id = "bob-pending-home-invitation-ready"
action = "runtime_event_occurred"
actor = "bob"
runtime_event_kind = "pending_home_invitation_ready"
timeout_ms = 30000

[[steps]]
id = "bob-join-shared-channel"
action = "accept_pending_channel_invitation"
actor = "bob"
timeout_ms = 30000

[[steps]]
id = "bob-open-chat-after-accept"
action = "open_screen"
actor = "bob"
screen_id = "chat"
timeout_ms = 6000

[[steps]]
id = "bob-join-shared-channel-explicit"
action = "join_channel"
actor = "bob"
value = "shared-parity-lab"
timeout_ms = 6000

[[steps]]
id = "bob-channel-membership-ready"
action = "runtime_event_occurred"
actor = "bob"
runtime_event_kind = "channel_membership_ready"
timeout_ms = 120000

[[steps]]
id = "alice-recipient-peers-resolved"
action = "runtime_event_occurred"
actor = "alice"
runtime_event_kind = "recipient_peers_resolved"
timeout_ms = 120000

# Every send toward bob goes through the runtime's relay-first path selection;
# across NATs the selected path must be the relay.
[[steps]]
id = "alice-peer-path-selected"
action = "runtime_event_occurred"
actor = "alice"
runtime_event_kind = "peer_path_selected"
value = "relay"
timeout_ms = 30000


[[steps]]
id = "flush-nat-b"
action = "network_flush_nat"
value = "nat-b"
timeout_ms = 5000

[[steps]]
id = "alice-link-down"
action = "network_link_down"
actor = "alice"
timeout_ms = 5000

[[steps]]
id = "alice-link-up"
action = "network_link_up"
actor = "alice"
timeout_ms = 5000

[[steps]]
id = "alice-degraded-link"
action = "network_set_link_condition"
actor = "alice"
value = "wifi_bursty"
timeout_ms = 5000

# The NAT flush broke bob's relay session; re-registering advances bob's
# network generation, which the next send toward alice re-evaluates under.
[[steps]]
id = "bob-peer-path-regenerated"
action = "runtime_event_occurred"
actor = "bob"
runtime_event_kind = "peer_path_selected"
value = "network_generation:1"
timeout_ms = 120000

[[steps]]
id = "alice-ready-after-network-events"
action = "readiness_is"
actor = "alice"
readiness = "ready"
timeout_ms = 60000

[[steps]]
id = "bob-ready-after-network-events"
action = "readiness_is"
actor = "bob"
readiness = "ready"
timeout_ms = 60000
