name: CI / Deep Harness
run-name: ci/deep-harness/${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      bootstrap_checkpoint:
        description: Run only the exact bootstrap mailbox checkpoint inventory
        type: boolean
        default: false
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "0 7 * * *"

env:
  CARGO_TERM_COLOR: always
  AURA_SUPPRESS_NIX_WELCOME: 1

jobs:
  bootstrap-checkpoint:
    name: Bootstrap Mailbox Exact Fixtures
    if: github.event_name == 'workflow_dispatch' && inputs.bootstrap_checkpoint == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-nix
      - name: Compile, discover, execute and replay the first failure
        run: |
          nix develop .#ci --command bash scripts/dev/run-exact-fixtures.sh \
            --lane bootstrap-checkpoint \
            --package aura-simulator --test bootstrap_delivery_checkpoint \
            --replay-first-failure --expected-count 4 \
            --decisive-name bootstrap_checkpoint_canonical_contact_and_enrollment_dispatch \
            --name bootstrap_checkpoint_canonical_contact_and_enrollment_dispatch \
            --name bootstrap_checkpoint_cancellation_preserves_other_device_delivery \
            --name bootstrap_checkpoint_two_device_credentials_refresh_and_one_use \
            --name bootstrap_checkpoint_wrong_purpose_foreign_recipient_and_verification_refuse
        env:
          CARGO_BUILD_JOBS: 4
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CARGO_INCREMENTAL: 0
      - name: Retain original receipts and compiled fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-checkpoint-${{ github.run_id }}
          path: |
            artifacts/disk-budget/receipts
            target/debug/deps/bootstrap_delivery_checkpoint-*
          if-no-files-found: error

  build:
    if: inputs.bootstrap_checkpoint != true
    name: Harness Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-build
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-build

  contract:
    if: inputs.bootstrap_checkpoint != true
    name: Harness Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-contract
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-contract

  ui-state-evented:
    if: inputs.bootstrap_checkpoint != true
    name: Harness UI Evented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-harness-ui-state-evented
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop .#ci --command just ci-harness-ui-state-evented

  matrix-inventory:
    if: inputs.bootstrap_checkpoint != true
    name: Harness Matrix Inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-matrix-inventory
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-matrix-inventory

  shared-intent:
    if: inputs.bootstrap_checkpoint != true
    name: Harness Shared Intent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-shared-intent-contract
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-shared-intent-contract

  replay:
    name: Harness Replay
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.bootstrap_checkpoint != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-replay
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-replay

  browser:
    if: inputs.bootstrap_checkpoint != true
    name: Harness Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-harness-browser
        env:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      - name: Upload browser harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-browser-${{ github.run_id }}
          path: artifacts/harness/browser
          if-no-files-found: warn
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop .#ci --command just ci-harness-browser

  matrix-tui:
    name: Harness Matrix TUI
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.bootstrap_checkpoint != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-harness-matrix-tui
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop --command just ci-harness-matrix-tui

  matrix-web:
    name: Harness Matrix Web
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && inputs.bootstrap_checkpoint != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-harness-matrix-web
        env:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
      - name: Upload browser harness artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-matrix-web-${{ github.run_id }}
          path: artifacts/harness/browser
          if-no-files-found: warn
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: harness-deep
          replay-command: nix develop .#ci --command just ci-harness-matrix-web
