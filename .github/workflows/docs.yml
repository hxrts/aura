name: Docs / Site
run-name: docs/site/${{ github.event_name }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  AURA_SUPPRESS_NIX_WELCOME: 1

jobs:
  git-lfs-fixture-diagnostic:
    name: Hosted Git fixture / cache-policy diagnostic
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record filter key origins and reproduce the original refusal
        shell: bash
        run: |
          set -euo pipefail
          printf 'image=%s version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          result=0
          /usr/bin/git config --show-origin --show-scope --name-only --get-regexp '^filter\.' || result=$?
          if (( result != 0 && result != 1 )); then exit "$result"; fi
          baseline=0
          bash scripts/dev/test-policy-static-git-inputs.sh > /tmp/ci-git-native-baseline.log 2>&1 || baseline=$?
          printf 'original-fixture-exit=%s\n' "$baseline"
          if (( baseline != 2 )); then
            echo 'Expected original refusal was not reproduced; this is not acceptance.' >&2
            exit 3
          fi
      - name: Isolate Git fixture inputs from runner Git LFS helpers
        shell: bash
        run: |
          # This job uses a disposable GitHub-hosted runner and no LFS files.
          # Retain the policy's refusal of external filters; remove only the
          # runner's unused system LFS configuration before capturing inputs.
          if /usr/bin/git config --system --name-only --get-regexp '^filter\.lfs\.' >/dev/null; then
            sudo /usr/bin/git config --system --remove-section filter.lfs
          else
            result=$?
            if (( result != 1 )); then exit "$result"; fi
          fi
      - name: Execute focused native fixture after isolation
        run: bash scripts/dev/test-policy-static-git-inputs.sh 2>&1 | tee /tmp/ci-git-native-after.log
      - uses: ./.github/actions/setup-nix
      - name: Execute focused fixture with pinned Nix Git
        run: nix develop .#ci --command bash scripts/dev/test-policy-static-git-inputs.sh 2>&1 | tee /tmp/ci-git-nix-after.log
      - name: Execute existing cache-policy gate after the focused checkpoint
        run: nix develop .#ci --command just ci-build-cache-policy 2>&1 | tee /tmp/ci-git-cache-policy.log
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-git-fixture-diagnostic
          path: /tmp/ci-git-*.log
          if-no-files-found: warn

  links:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-docs-links
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
          replay-command: nix develop .#ci --command just ci-docs-links

  crate-links:
    name: Crate Doc Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-crates-doc-links
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
          replay-command: nix develop .#ci --command just ci-crates-doc-links

  text-formatting:
    name: Text Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-text-formatting
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
          replay-command: nix develop .#ci --command just ci-text-formatting

  semantic-drift:
    name: Semantic Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop .#ci --command just ci-docs-semantic-drift
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
          replay-command: nix develop .#ci --command just ci-docs-semantic-drift

  build:
    name: Docs Build
    needs: [links, crate-links, text-formatting, semantic-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
      - run: nix develop --command just ci-book
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
          replay-command: nix develop --command just ci-book

  deploy:
    name: Docs Deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Failure bundle
        if: failure()
        uses: ./.github/actions/failure-bundle
        with:
          name: docs
